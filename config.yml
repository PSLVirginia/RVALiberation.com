# Site Configuration

# Theme, mapped to the directory: ./theme/xxxx
theme: defensa

# HTML Language setting
#lang: "en"

# Plugins, implemented in ./plugins/PLUGIN_NAME
# Use {{ vars.PLUGIN_NAME }} in the settings below

# The output of the plugin can be used below, e.g., {{vars.MediumFollowersCountPlugin}}
#plugins:
#  # Automatically fetch Medium follower count
#  - MediumFollowersCountPlugin:
#      username: zhgchgli
#  # Automatically fetch Github repo star count
#  - GithubRepoStarsCountPlugin:
#      - ZhgChgLi/ZMarkupParser
#      - ZhgChgLi/ZReviewTender
#      - ZhgChgLi/ZMediumToMarkdown
#      - ZhgChgLi/linkyee
plugins:
  - I18n:
      supported_langs: ["en", "es", "zh"]
      translations:
        Title:
          en: "Richmond Defensa"
          es: "Richmond Defensa"
          zh: "里士满地分撒"
        Name:
          en: "@richmonddefensa"
          es: "@richmonddefensa"
          zh: "@richmonddefensa"
        Tagline:
          en: "The Richmond Liberation Center is a home for political organizing to achieve social and economic justice in the city that we all call home. We work so that between every large movement, dedicated activists are able to sustain the fight for a better world."
          es: "El Richmond Liberation Center es un centro de organización política para lograr la justicia social y económica en la ciudad que todos llamamos nuestro hogar. Trabajamos para que, entre cada gran movimiento, los activistas comprometidos puedan mantener la lucha por un mundo mejor."
          zh: "里士满解放中心是推动政治组织工作的基地，致力于为我们共同的家园——这座城市实现社会与经济正义。我们努力确保在每次大型运动之间，坚定的活动家们能够持续为更美好的世界而奋斗。"
        Support:
          en: "Support The Liberation Center!"
          es: "¡Apoya al Centro de Liberación!"
          zh: "支持解放中心！"
        Instagram:
          en: "Follow Us On Instagram"
          es: "Síguenos en Instagram"
          zh: "在Instagram上关注我们"
        RAADPetition:
          en: "Sign The Artists Against Deportation Statement"
          es: "Firma La Declaración De Artistas Contra La Deportación"
          zh: "签署Artists Against Apartheid声明"
        Report:
          en: "Report Suspicious Activity"
          es: "Denunciar Actividad Sospechosa"
          zh: "举报可疑活动"
        MayDay:
          en: "Endorse The May 1st General Strike!"
          es: "¡Apoya la Huelga General del 1º de Mayo!"
          zh: "支持五一总罢工！"

# Google Analytics tracking id
#google_analytics_id:

# HTML Title
title: "Richmond Liberation Center Linkyee"

# Avatar image path
avatar: "./images/Logo.svg"

# Name section text
#name: "@richmonddefensa"

# Tagline section text
tagline: >-
    {{vars.I18n['Tagline']}}

# List of links
# icon: Use Font Awesome icons (https://fontawesome.com/search?o=r&m=free)
# text: The displayed text for the link
# title: The url title
# url: The URL of the link
# alt: Alternative text for accessibility
# target: `_blank` opens in a new tab, `_self` opens in the same frame
links:
  - link:
      icon: "fa-solid fa-hand-holding-dollar"
      text: "<span class='link-button-text-bold'>{{vars.I18n['Support']}}</span>"
      url: "https://theyeisblind.substack.com/p/the-eyes-is-blind-that-will-not-see"
      alt: "Report"
      title: "Report"
      target: "_blank"
  - link:
      icon: "fa-solid fa-m"
      text: "{{vars.I18n['MayDay']}}"
      url: "https://theyeisblind.substack.com/p/the-eyes-is-blind-that-will-not-see"
      alt: "MayDay Endorsement Form"
      title: "MayDay Endorsement Form"
      target: "_blank"
  - link:
      icon: "fa-brands fa-instagram"
      text: "{{vars.I18n['Instagram']}}"
      url: "https://theyeisblind.substack.com/p/the-eyes-is-blind-that-will-not-see"
      alt: "Instagram"
      title: "Instagram"
      target: "_blank"
