  - link:
      icon: "fa-solid fa-palette"
      text: "{{vars.I18n['RAADPetition']}}"
      url: "https://theyeisblind.substack.com/p/the-eyes-is-blind-that-will-not-see"
      alt: "RAAD Statement"
      title: "RAAD Statement"
      target: "_blank"
  - link:
      icon: "fa-solid fa-bullhorn"
      text: "{{vars.I18n['Report']}}"
      url: "https://theyeisblind.substack.com/p/the-eyes-is-blind-that-will-not-see"
      alt: "Report"
      title: "Report"
      target: "_blank"


